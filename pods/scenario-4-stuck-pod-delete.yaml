# Scenario 4: Stuck/Error state — Auto-Fix: delete_pod
# Pod gets stuck in an Error/Unknown state (simulated by a bad init container).
# The agent detects non-running status + no restarts (just stuck) and suggests:
#   → kubectl delete pod <pod-name> -n default --grace-period=0
# Kubernetes will recreate the pod from the ReplicaSet cleanly.
#
# Deploy:  kubectl apply -f scenario-4-stuck-pod-delete.yaml
# Watch:   kubectl get pods -w -n default
# Fix:     kubectl delete pod <stuck-pod-name> -n default --grace-period=0

apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-processor
  namespace: default
  labels:
    app: worker-processor
    scenario: "auto-fix-delete-pod"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-processor
  template:
    metadata:
      labels:
        app: worker-processor
    spec:
      # Init container fails — main container never starts — pod stuck in Init:Error
      initContainers:
        - name: db-migrator
          image: busybox:1.36
          command: ["/bin/sh", "-c", "echo 'ERROR: database migration failed: connection refused'; exit 1"]
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "32Mi"
              cpu: "50m"
      containers:
        - name: worker
          image: busybox:1.36
          command: ["/bin/sh", "-c", "echo 'Worker started'; sleep 3600"]
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
