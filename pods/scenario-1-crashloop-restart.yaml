# Scenario 1: CrashLoopBackOff — Auto-Fix: restart_deployment
# The app container exits immediately (bad command), causing repeated restarts.
# The agent will detect CrashLoopBackOff + high restart count and suggest:
#   → kubectl rollout restart deployment/crashloop-app -n default
#
# Deploy:  kubectl apply -f scenario-1-crashloop-restart.yaml
# Watch:   kubectl get pods -w -n default
# Trigger: kubectl rollout restart deployment/crashloop-app -n default

apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-app
  namespace: default
  labels:
    app: crashloop-app
    scenario: "auto-fix-restart"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crashloop-app
  template:
    metadata:
      labels:
        app: crashloop-app
    spec:
      containers:
        - name: crashloop-container
          image: busybox:1.36
          # Exits immediately with error — causes CrashLoopBackOff
          command: ["/bin/sh", "-c", "echo 'FATAL: config file not found'; exit 1"]
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "50m"
