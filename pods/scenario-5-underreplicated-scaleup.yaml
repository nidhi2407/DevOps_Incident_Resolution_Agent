# Scenario 5: Under-replicated / degraded deployment — Auto-Fix: scale_up
# Deployment is intentionally set to 0 replicas (or scaled down accidentally).
# The agent detects 0 ready pods on a critical service and suggests:
#   → kubectl scale deployment/orders-api --replicas=2 -n default
#
# Deploy:  kubectl apply -f scenario-5-underreplicated-scaleup.yaml
# Watch:   kubectl get pods -w -n default
# Fix:     kubectl scale deployment/orders-api --replicas=2 -n default

apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: default
  labels:
    app: orders-api
    scenario: "auto-fix-scale-up"
spec:
  replicas: 0      # accidentally scaled to 0 — all traffic fails
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      containers:
        - name: orders-service
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          env:
            - name: SERVICE_NAME
              value: "orders-api"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
# HorizontalPodAutoscaler (optional, shows desired vs actual replicas)
apiVersion: v1
kind: Service
metadata:
  name: orders-api-svc
  namespace: default
spec:
  selector:
    app: orders-api
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
